{% extends "admin/base_site.html" %}

{% block extrastyle %}{{ block.super }}
<style>
  .mes-dashboard__links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .button-accent { background: var(--primary, #79aec8); border-color: var(--primary, #79aec8); color: #fff; }
</style>
{% endblock %}

{% block content %}
<div id="content-main">
  <div class="module">
    <p>Управление резервными копиями базы данных и медиафайлов.</p>

    <div class="mes-dashboard__links">
      <a class="button button-accent" href="{% url 'mes_admin:backup_create' %}">Создать бэкап</a>
      <a class="button" href="{% url 'mes_admin:backup_restore_upload' %}">Восстановить из архива</a>
      <a class="button" href="{% url 'mes_admin:backup_wipe' %}">Очистить все данные</a>
    </div>

    {% include "admin/backup/_backup_table.html" %}
  </div>
</div>
{% endblock %}
