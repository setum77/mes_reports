{% extends "base.html" %}

{% block title %}Добавить комментарий{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header"><h5 class="mb-0">Добавить комментарий</h5></div>
        <div class="card-body">
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label">Серийный номер БУ</label>
              <input type="text" name="pcs_no" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Станция</label>
              <input type="number" name="station_no" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Комментарий</label>
              <textarea name="comment" class="form-control" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a href="{% url 'reports:report5' %}" class="btn btn-outline-secondary">Назад</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
