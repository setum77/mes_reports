[project]
name = "mes-report3"
version = "0.1.0"
description = "MES Production Reports - Django app for processing MES Excel exports and generating production reports"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<6.0",
    "psycopg2-binary>=2.9",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "gunicorn>=22.0",
    "django-widget-tweaks>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
DJANGO_SETTINGS_MODULE = "mes_report3.settings.dev"

[tool.django]
settings = "mes_report3.settings.dev"
